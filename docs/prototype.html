<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serv · prototype</title>
<style>
  :root { --ink:#1b1f24; --muted:#5f6b76; --line:#e3e7eb; --bg:#f6f7f9; --card:#fff; --brand:#0f766e; --brand-soft:#e6f4f2; --warn:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header b { font-size:20px; color:var(--brand); }
  header .tag { color:var(--muted); font-size:13px; flex:1; }
  header nav { display:flex; gap:6px; }
  header nav button { width:auto; margin:0; padding:6px 10px; font-size:14px; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h2 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  button { font:inherit; border:0; border-radius:8px; padding:11px 16px; background:var(--brand); color:#fff; cursor:pointer; width:100%; margin-top:14px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  button.danger { background:transparent; color:var(--warn); border:1px solid var(--warn); }
  .pro { display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .pro:hover { border-color:var(--brand); }
  .avatar { width:44px; height:44px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; font-weight:700; flex:none; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .muted { color:var(--muted); font-size:14px; }
  .badge { display:inline-block; font-size:12px; background:var(--brand-soft); color:var(--brand); border-radius:999px; padding:2px 8px; margin:4px 4px 0 0; }
  .price { font-weight:700; }
  .sort { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .sort button { width:auto; margin:0; padding:6px 12px; font-size:14px; background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .sort button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .day { margin-top:10px; font-size:13px; font-weight:600; }
  .slots { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .slot { width:auto; margin:0; padding:8px 12px; background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .slot.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .slot:disabled { text-decoration:line-through; }
  .steps { list-style:none; padding:0; margin:0; }
  .steps li { padding:8px 0 8px 28px; position:relative; color:var(--muted); }
  .steps li::before { content:""; position:absolute; left:6px; top:14px; width:10px; height:10px; border-radius:50%; background:var(--line); }
  .steps li.done { color:var(--ink); }
  .steps li.done::before { background:var(--brand); }
  .stars button { width:auto; margin:0 4px 0 0; padding:4px 8px; font-size:22px; background:none; color:#c9ced3; }
  .stars button.on { color:#f59e0b; }
  .note { font-size:13px; color:var(--warn); margin-top:8px; }
  .status { font-size:12px; border-radius:999px; padding:2px 8px; background:var(--brand-soft); color:var(--brand); white-space:nowrap; }
  .status.off { background:#f1f3f5; color:var(--muted); }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <b>Serv</b><span class="tag" data-t="tagline"></span>
  <nav>
    <button class="ghost" id="nav-bookings" data-t="myBookings"></button>
    <button class="ghost" id="lang">ES</button>
  </nav>
</header>
<main>

  <!-- 1. Describe the job -->
  <section id="s-job">
    <h2 data-t="whatFix"></h2>
    <div class="card">
      <label for="zip" data-t="zip"></label>
      <input id="zip" inputmode="numeric" maxlength="5" placeholder="11211" value="11211">
      <label for="job" data-t="job"></label>
      <select id="job"></select>
      <button id="find" data-t="seePros"></button>
      <p id="zipmsg" class="note hidden"></p>
    </div>
  </section>

  <!-- 2. Pick a pro -->
  <section id="s-pros" class="hidden">
    <h2><span data-t="prosNear"></span> <span id="zipname"></span></h2>
    <p class="muted" data-t="prosNote"></p>
    <div class="sort" id="sort"></div>
    <div id="pros"></div>
    <button class="ghost" data-back="s-job" data-t="back"></button>
  </section>

  <!-- 3. Book a time -->
  <section id="s-book" class="hidden">
    <h2><span data-t="book"></span> <span id="bk-name"></span></h2>
    <div class="card">
      <div class="row"><span id="bk-job"></span><span class="price" id="bk-price"></span></div>
      <p class="muted" id="bk-hours"></p>
      <label data-t="pickTime"></label>
      <div id="slots"></div>
      <label for="card" data-t="card"></label>
      <input id="card" inputmode="numeric" placeholder="4242 4242 4242 4242">
      <button id="pay" disabled data-t="bookHold"></button>
      <p id="paymsg" class="note hidden"></p>
      <p class="muted" style="margin:8px 0 0" data-t="holdNote"></p>
    </div>
    <button class="ghost" data-back="s-pros" data-t="back"></button>
  </section>

  <!-- 4. Track and confirm -->
  <section id="s-track" class="hidden">
    <h2 data-t="yourBooking"></h2>
    <div class="card">
      <div class="row"><b id="tr-title"></b><span class="price" id="tr-price"></span></div>
      <p class="muted" id="tr-when"></p>
      <ul class="steps" id="steps"></ul>
      <p id="tr-cancelled" class="note hidden" data-t="cancelled"></p>
      <button id="advance"></button>
      <button id="cancel" class="danger" data-t="cancel"></button>
    </div>
    <button class="ghost" id="track-back" data-t="myBookings"></button>
  </section>

  <!-- 5. Rate -->
  <section id="s-rate" class="hidden">
    <h2 data-t="howGo"></h2>
    <div class="card">
      <p class="muted"><span data-t="released"></span> <span id="rt-name"></span>.</p>
      <div class="stars" id="stars"></div>
      <button id="done" disabled data-t="submitRating"></button>
    </div>
  </section>

  <section id="s-thanks" class="hidden">
    <div class="card"><h2 data-t="thanks"></h2><p class="muted" data-t="thanksNote"></p>
    <button id="restart" class="ghost" data-t="another"></button></div>
  </section>

  <!-- My bookings -->
  <section id="s-list" class="hidden">
    <h2 data-t="myBookings"></h2>
    <div id="list"></div>
    <button class="ghost" data-back="s-job" data-t="another"></button>
    <button class="ghost" id="reset" data-t="reset"></button>
  </section>
</main>

<script>
// All data is invented. Bookings are saved in this browser only, so the demo can be reset.
const T = {
  en: {
    tagline: "Prototype · fake data, no real payments", myBookings: "My bookings",
    whatFix: "What needs fixing?", zip: "Your ZIP code", job: "Job", seePros: "See verified pros",
    notArea: "Serv is only in Brooklyn and Manhattan for now.", prosNear: "Verified pros near",
    prosNote: "Every pro has passed an ID check. Prices are fixed before you book.",
    sortRec: "Recommended", sortPrice: "Lowest price", sortRating: "Top rated",
    idv: "ID verified", protected: "Payment protected", nextOpen: "Next open", noOpen: "No open times this week",
    back: "Back", book: "Book", hours: "Works", pickTime: "Pick a time (crossed out = already booked)",
    card: "Card (prototype only, nothing is charged)", bookHold: "Book and hold payment",
    badCard: "Enter a 16-digit card number (any digits work here).",
    taken: "Sorry, that time was just booked. Pick another.",
    holdNote: "Your payment is held and only released to the pro after you confirm the job is done.",
    yourBooking: "Your booking", cancel: "Cancel booking",
    cancelled: "Cancelled before the pro accepted. The hold was released and you were not charged.",
    steps: ["Booked, payment held", "Pro accepted", "Pro checked in", "Job marked done", "You confirmed, payment released"],
    advance: ["Simulate: pro accepts", "Simulate: pro checks in", "Simulate: pro marks done", "Confirm job is done"],
    howGo: "How did it go?", released: "Payment released to", submitRating: "Submit rating",
    thanks: "Thanks!", thanksNote: "Your rating helps neighbors pick the right pro.", another: "Book another job",
    none: "No bookings yet.", reset: "Reset demo data",
    st: { active: "In progress", rate: "Needs rating", done: "Done", cancelled: "Cancelled" },
    jobs: ["Fix a leaky faucet", "Mount a TV or shelves", "Assemble furniture", "Patch and paint a wall"],
    days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], jobsDone: "jobs",
  },
  es: {
    tagline: "Prototipo · datos ficticios, sin pagos reales", myBookings: "Mis reservas",
    whatFix: "¿Qué hay que arreglar?", zip: "Tu código postal", job: "Trabajo", seePros: "Ver profesionales verificados",
    notArea: "Por ahora Serv solo está en Brooklyn y Manhattan.", prosNear: "Profesionales verificados cerca de",
    prosNote: "Cada profesional pasó una verificación de identidad. El precio es fijo antes de reservar.",
    sortRec: "Recomendados", sortPrice: "Menor precio", sortRating: "Mejor valorados",
    idv: "Identidad verificada", protected: "Pago protegido", nextOpen: "Próximo horario", noOpen: "Sin horarios esta semana",
    back: "Atrás", book: "Reservar con", hours: "Trabaja", pickTime: "Elige un horario (tachado = ya reservado)",
    card: "Tarjeta (solo prototipo, no se cobra nada)", bookHold: "Reservar y retener el pago",
    badCard: "Escribe un número de tarjeta de 16 dígitos (cualquiera sirve aquí).",
    taken: "Ese horario se acaba de reservar. Elige otro.",
    holdNote: "Tu pago queda retenido y solo se libera al profesional cuando confirmas que el trabajo está hecho.",
    yourBooking: "Tu reserva", cancel: "Cancelar reserva",
    cancelled: "Cancelada antes de que el profesional aceptara. Se liberó la retención y no se te cobró.",
    steps: ["Reservado, pago retenido", "El profesional aceptó", "El profesional llegó", "Trabajo terminado", "Confirmaste, pago liberado"],
    advance: ["Simular: el profesional acepta", "Simular: el profesional llega", "Simular: el profesional termina", "Confirmar que está hecho"],
    howGo: "¿Cómo te fue?", released: "Pago liberado a", submitRating: "Enviar valoración",
    thanks: "¡Gracias!", thanksNote: "Tu valoración ayuda a tus vecinos a elegir bien.", another: "Reservar otro trabajo",
    none: "Todavía no tienes reservas.", reset: "Borrar datos de prueba",
    st: { active: "En curso", rate: "Falta valorar", done: "Terminada", cancelled: "Cancelada" },
    jobs: ["Arreglar una llave que gotea", "Colgar un televisor o estantes", "Armar muebles", "Resanar y pintar una pared"],
    days: ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"], jobsDone: "trabajos",
  },
};
const AREAS = { "112": "Brooklyn", "100": "Manhattan", "101": "Manhattan", "102": "Manhattan" };
// Each pro has their own working days (0 = Mon) and hours (24h clock).
const PROS = [
  { id: "marco", name: "Marco R.", hood: "Williamsburg", area: "Brooklyn", rating: 4.9, jobs: 132, prices: [95, 120, 90, 150], days: [0, 1, 2, 3, 4], from: 8, to: 16 },
  { id: "aisha", name: "Aisha K.", hood: "Bed-Stuy", area: "Brooklyn", rating: 4.8, jobs: 87, prices: [90, 110, 85, 140], days: [1, 3, 5], from: 10, to: 18 },
  { id: "dev", name: "Dev S.", hood: "Park Slope", area: "Brooklyn", rating: 4.6, jobs: 58, prices: [85, 115, 80, 135], days: [4, 5, 6], from: 9, to: 15 },
  { id: "tomas", name: "Tomás G.", hood: "East Village", area: "Manhattan", rating: 4.7, jobs: 210, prices: [110, 130, 100, 165], days: [0, 2, 4], from: 12, to: 20 },
  { id: "grace", name: "Grace L.", hood: "Harlem", area: "Manhattan", rating: 4.8, jobs: 96, prices: [100, 120, 95, 155], days: [0, 1, 2, 3], from: 7, to: 13 },
  { id: "lena", name: "Lena P.", hood: "Upper West Side", area: "Manhattan", rating: 5.0, jobs: 41, prices: [105, 125, 95, 160], days: [5, 6], from: 10, to: 16 },
];
const JOB_HOURS = 2; // every job in the prototype takes a 2-hour slot

const $ = id => document.getElementById(id);
const store = {
  get() { try { return JSON.parse(localStorage.getItem("serv-proto")) || { bookings: [] }; } catch { return { bookings: [] }; } },
  set(d) { try { localStorage.setItem("serv-proto", JSON.stringify(d)); } catch {} },
};
let db = store.get();
// Seed a few bookings by "other customers" so some times already show as taken.
if (!db.seeded) {
  db.seeded = true;
  db.bookings.push(
    { id: "x1", other: true, proId: "marco", slot: "1-10", status: "active" },
    { id: "x2", other: true, proId: "aisha", slot: "3-12", status: "active" },
    { id: "x3", other: true, proId: "tomas", slot: "0-14", status: "active" },
  );
  store.set(db);
}
const state = { lang: "en", zip: "", area: "", job: 0, pro: null, slot: null, sort: "rec", current: null, stars: 0 };
const t = k => T[state.lang][k];
const show = id => document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hidden", s.id !== id));
const proById = id => PROS.find(p => p.id === id);

function fmtHour(h) { return state.lang === "en" ? `${h % 12 || 12}${h < 12 ? "am" : "pm"}` : `${h}:00`; }
function fmtSlot(slot) { const [d, h] = slot.split("-").map(Number); return `${t("days")[d]} ${fmtHour(h)}`; }
function slotsFor(p) { const out = []; p.days.forEach(d => { for (let h = p.from; h + JOB_HOURS <= p.to; h += JOB_HOURS) out.push(`${d}-${h}`); }); return out; }
function isTaken(proId, slot) { return db.bookings.some(b => b.proId === proId && b.slot === slot && b.status !== "cancelled"); }
function openSlots(p) { return slotsFor(p).filter(s => !isTaken(p.id, s)); }

function applyText() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("lang").textContent = state.lang === "en" ? "ES" : "EN";
  const sel = $("job"), cur = sel.value || 0;
  sel.innerHTML = ""; t("jobs").forEach((j, i) => sel.add(new Option(j, i))); sel.value = cur;
}
function rerender() {
  applyText();
  const vis = [...document.querySelectorAll("main > section")].find(s => !s.classList.contains("hidden"));
  if (vis.id === "s-pros") renderPros();
  if (vis.id === "s-book") renderBook();
  if (vis.id === "s-track") renderTrack();
  if (vis.id === "s-list") renderList();
}
$("lang").onclick = () => { state.lang = state.lang === "en" ? "es" : "en"; rerender(); };
document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => { show(b.dataset.back); rerender(); });
$("nav-bookings").onclick = $("track-back").onclick = () => { show("s-list"); renderList(); };

$("find").onclick = () => {
  state.zip = $("zip").value.trim();
  state.area = AREAS[state.zip.slice(0, 3)];
  state.job = +$("job").value;
  const msg = $("zipmsg");
  if (!/^\d{5}$/.test(state.zip) || !state.area) { msg.textContent = t("notArea"); msg.classList.remove("hidden"); return; }
  msg.classList.add("hidden");
  show("s-pros"); renderPros();
};

function renderPros() {
  $("zipname").textContent = `${state.zip} (${state.area})`;
  $("sort").innerHTML = [["rec", "sortRec"], ["price", "sortPrice"], ["rating", "sortRating"]]
    .map(([k, l]) => `<button class="${state.sort === k ? "on" : ""}" data-s="${k}">${t(l)}</button>`).join("");
  document.querySelectorAll("#sort button").forEach(b => b.onclick = () => { state.sort = b.dataset.s; renderPros(); });
  let list = PROS.filter(p => p.area === state.area);
  if (state.sort === "price") list.sort((a, b) => a.prices[state.job] - b.prices[state.job]);
  else if (state.sort === "rating") list.sort((a, b) => b.rating - a.rating);
  else {
    // Recommended: pros with open times first, then rotate the order daily so newer pros also get seen.
    const shift = new Date().getDate() % Math.max(list.length, 1);
    list = [...list.slice(shift), ...list.slice(0, shift)];
    list.sort((a, b) => (openSlots(b).length > 0) - (openSlots(a).length > 0));
  }
  $("pros").innerHTML = list.map(p => {
    const open = openSlots(p);
    return `<div class="card pro" data-id="${p.id}">
      <div class="avatar">${p.name[0]}</div>
      <div style="flex:1">
        <div class="row"><b>${p.name}</b><span class="price">$${p.prices[state.job]}</span></div>
        <div class="muted">${p.hood} · ★ ${p.rating.toFixed(1)} (${p.jobs} ${t("jobsDone")})</div>
        <div class="muted">${open.length ? `${t("nextOpen")}: ${fmtSlot(open[0])}` : t("noOpen")}</div>
        <span class="badge">${t("idv")}</span><span class="badge">${t("protected")}</span>
      </div></div>`;
  }).join("");
  document.querySelectorAll(".pro").forEach(el => el.onclick = () => { state.pro = proById(el.dataset.id); state.slot = null; show("s-book"); renderBook(); });
}

function renderBook() {
  const p = state.pro;
  $("bk-name").textContent = p.name;
  $("bk-job").textContent = t("jobs")[state.job];
  $("bk-price").textContent = "$" + p.prices[state.job];
  $("bk-hours").textContent = `${t("hours")}: ${p.days.map(d => t("days")[d]).join(", ")} · ${fmtHour(p.from)}–${fmtHour(p.to)}`;
  const byDay = {};
  slotsFor(p).forEach(s => (byDay[s.split("-")[0]] ||= []).push(s));
  $("slots").innerHTML = Object.entries(byDay).map(([d, ss]) => `<div class="day">${t("days")[d]}</div><div class="slots">${
    ss.map(s => `<button class="slot ${state.slot === s ? "on" : ""}" data-slot="${s}" ${isTaken(p.id, s) ? "disabled" : ""}>${fmtHour(+s.split("-")[1])}</button>`).join("")}</div>`).join("");
  document.querySelectorAll(".slot").forEach(b => b.onclick = () => { state.slot = b.dataset.slot; renderBook(); });
  $("pay").disabled = !state.slot;
  $("paymsg").classList.add("hidden");
}

$("pay").onclick = () => {
  const msg = $("paymsg");
  if ($("card").value.replace(/\D/g, "").length !== 16) { msg.textContent = t("badCard"); msg.classList.remove("hidden"); return; }
  db = store.get();
  // Check again right before booking, so two customers can't take the same time.
  if (isTaken(state.pro.id, state.slot)) { msg.textContent = t("taken"); state.slot = null; renderBook(); msg.classList.remove("hidden"); return; }
  const b = { id: "b" + Date.now(), proId: state.pro.id, job: state.job, price: state.pro.prices[state.job], slot: state.slot, area: state.area, step: 1, status: "active" };
  db.bookings.push(b); store.set(db);
  $("card").value = "";
  state.current = b.id; show("s-track"); renderTrack();
};

const cur = () => db.bookings.find(b => b.id === state.current);
function save() { store.set(db); }
function renderTrack() {
  const b = cur(), p = proById(b.proId);
  $("tr-title").textContent = `${t("jobs")[b.job]} · ${p.name}`;
  $("tr-price").textContent = "$" + b.price;
  $("tr-when").textContent = `${fmtSlot(b.slot)} · ${b.area}`;
  $("steps").innerHTML = t("steps").map((s, i) => `<li class="${b.status !== "cancelled" && i < b.step ? "done" : ""}">${s}</li>`).join("");
  const cancelled = b.status === "cancelled";
  $("tr-cancelled").classList.toggle("hidden", !cancelled);
  $("advance").classList.toggle("hidden", cancelled || b.step >= 5);
  $("advance").textContent = t("advance")[b.step - 1] || "";
  $("cancel").classList.toggle("hidden", cancelled || b.step !== 1); // only before the pro accepts
}
$("advance").onclick = () => {
  const b = cur(); b.step++;
  if (b.step >= 5) { b.step = 5; b.status = "rate"; save(); openRate(b); return; }
  save(); renderTrack();
};
$("cancel").onclick = () => { const b = cur(); b.status = "cancelled"; save(); renderTrack(); };

function openRate(b) { state.current = b.id; state.stars = 0; $("rt-name").textContent = proById(b.proId).name; $("done").disabled = true; renderStars(); show("s-rate"); }
function renderStars() {
  $("stars").innerHTML = [1, 2, 3, 4, 5].map(n => `<button class="${n <= state.stars ? "on" : ""}" data-n="${n}">★</button>`).join("");
  document.querySelectorAll("#stars button").forEach(b => b.onclick = () => { state.stars = +b.dataset.n; $("done").disabled = false; renderStars(); });
}
$("done").onclick = () => { const b = cur(); b.status = "done"; b.stars = state.stars; save(); show("s-thanks"); };
$("restart").onclick = () => { show("s-job"); };

function renderList() {
  const mine = db.bookings.filter(b => !b.other).reverse();
  $("list").innerHTML = mine.length ? mine.map(b => {
    const p = proById(b.proId);
    return `<div class="card pro" data-id="${b.id}"><div class="avatar">${p.name[0]}</div><div style="flex:1">
      <div class="row"><b>${t("jobs")[b.job]}</b><span class="status ${b.status === "cancelled" || b.status === "done" ? "off" : ""}">${t("st")[b.status]}</span></div>
      <div class="muted">${p.name} · ${fmtSlot(b.slot)} · $${b.price}${b.stars ? ` · ${"★".repeat(b.stars)}` : ""}</div></div></div>`;
  }).join("") : `<p class="muted">${t("none")}</p>`;
  document.querySelectorAll("#list .pro").forEach(el => el.onclick = () => {
    const b = db.bookings.find(x => x.id === el.dataset.id); state.current = b.id;
    if (b.status === "rate") openRate(b); else { show("s-track"); renderTrack(); }
  });
}
$("reset").onclick = () => { try { localStorage.removeItem("serv-proto"); } catch {} location.reload(); };

applyText();
</script>
</body>
</html>
